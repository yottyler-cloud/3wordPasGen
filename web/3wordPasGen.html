<title>3wordPasGen</title>
<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #1c1c1e;
  --muted: #8e8e93;
  --line: #d1d1d6;
  --accent: #0a84ff;
  --accent-text: #ffffff;
  --button: #e5e5ea;
  --danger: #d70015;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --text: #f2f2f7;
    --muted: #8e8e93;
    --line: #38383a;
    --accent: #0a84ff;
    --accent-text: #ffffff;
    --button: #2c2c2e;
    --danger: #ff453a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
  font-size: 17px;
  line-height: 1.4;
}
main {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 48px;
}
h1 {
  font-size: 32px;
  margin: 8px 4px 20px;
}
.card {
  background: var(--card);
  border-radius: 14px;
  margin-bottom: 20px;
  overflow: hidden;
}
.card > * + * { border-top: 1px solid var(--line); }
input {
  display: block;
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  padding: 14px 16px;
  outline: none;
}
input::placeholder { color: var(--muted); }
.actions {
  display: flex;
  gap: 12px;
  padding: 12px 16px;
}
button {
  font: inherit;
  border: 0;
  border-radius: 999px;
  padding: 8px 18px;
  background: var(--button);
  color: var(--accent);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:active { opacity: .6; }
.actions button { flex: 1; padding: 10px 18px; }
button.primary { background: var(--accent); color: var(--accent-text); }
.row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  padding: 12px 16px;
}
.row .label { white-space: nowrap; }
.row .pw {
  flex: 1 0 auto;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 19px;
  white-space: nowrap;
  -webkit-user-select: all;
  user-select: all;
}
/* 幅が足りないとき（iPhone など）はコピーボタンを次の行の右端へ */
.row button { white-space: nowrap; margin-left: auto; }
.status {
  color: var(--muted);
  margin: 0 4px;
  min-height: 1.4em;
}
.warning {
  color: var(--danger);
  padding: 14px 16px;
  font-weight: 600;
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>パスワード生成</h1>

  <div class="card" id="warning" hidden>
    <div class="warning">⚠️ Python 版と同じ結果になりません。このブラウザで生成したパスワードは使わないでください。</div>
  </div>

  <div class="card">
    <input id="kw1" placeholder="キーワード1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <input id="kw2" placeholder="キーワード2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <input id="kw3" placeholder="キーワード3" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
  </div>

  <div class="card">
    <div class="actions">
      <button type="button" class="primary" id="generate">生成</button>
      <button type="button" id="reset">リセット</button>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">記号あり:</span>
      <span class="pw" id="pw_symbols"></span>
      <button type="button" id="copy_symbols">記号ありコピー</button>
    </div>
    <div class="row">
      <span class="label">記号なし:</span>
      <span class="pw" id="pw_nosymbols"></span>
      <button type="button" id="copy_nosymbols">記号なしコピー</button>
    </div>
  </div>

  <p class="status" id="status"></p>
</main>
<script>
"use strict";
/*
 * 3wordPasGen（ブラウザ版）
 * 3wordPasGen.py と同じキーワードから、同じパスワードを生成する。
 * Python の hashlib.sha512 と random（Mersenne Twister）の動作をそのまま移植している。
 * 外部ライブラリ・通信は一切使わない。
 */
const ThreeWordPasGen = (() => {

  // ---------------------------------------------------------------
  // UTF-8 / SHA-512（Python の hashlib.sha512 と同じ結果）
  // ---------------------------------------------------------------
  const utf8 = (text) => new TextEncoder().encode(text);

  const SHA512_K = [
    "428a2f98d728ae22", "7137449123ef65cd", "b5c0fbcfec4d3b2f", "e9b5dba58189dbbc",
    "3956c25bf348b538", "59f111f1b605d019", "923f82a4af194f9b", "ab1c5ed5da6d8118",
    "d807aa98a3030242", "12835b0145706fbe", "243185be4ee4b28c", "550c7dc3d5ffb4e2",
    "72be5d74f27b896f", "80deb1fe3b1696b1", "9bdc06a725c71235", "c19bf174cf692694",
    "e49b69c19ef14ad2", "efbe4786384f25e3", "0fc19dc68b8cd5b5", "240ca1cc77ac9c65",
    "2de92c6f592b0275", "4a7484aa6ea6e483", "5cb0a9dcbd41fbd4", "76f988da831153b5",
    "983e5152ee66dfab", "a831c66d2db43210", "b00327c898fb213f", "bf597fc7beef0ee4",
    "c6e00bf33da88fc2", "d5a79147930aa725", "06ca6351e003826f", "142929670a0e6e70",
    "27b70a8546d22ffc", "2e1b21385c26c926", "4d2c6dfc5ac42aed", "53380d139d95b3df",
    "650a73548baf63de", "766a0abb3c77b2a8", "81c2c92e47edaee6", "92722c851482353b",
    "a2bfe8a14cf10364", "a81a664bbc423001", "c24b8b70d0f89791", "c76c51a30654be30",
    "d192e819d6ef5218", "d69906245565a910", "f40e35855771202a", "106aa07032bbd1b8",
    "19a4c116b8d2d0c8", "1e376c085141ab53", "2748774cdf8eeb99", "34b0bcb5e19b48a8",
    "391c0cb3c5c95a63", "4ed8aa4ae3418acb", "5b9cca4f7763e373", "682e6ff3d6b2b8a3",
    "748f82ee5defb2fc", "78a5636f43172f60", "84c87814a1f0ab72", "8cc702081a6439ec",
    "90befffa23631e28", "a4506cebde82bde9", "bef9a3f7b2c67915", "c67178f2e372532b",
    "ca273eceea26619c", "d186b8c721c0c207", "eada7dd6cde0eb1e", "f57d4f7fee6ed178",
    "06f067aa72176fba", "0a637dc5a2c898a6", "113f9804bef90dae", "1b710b35131c471b",
    "28db77f523047d84", "32caab7b40c72493", "3c9ebe0a15c9bebc", "431d67c49c100d4c",
    "4cc5d4becb3e42b6", "597f299cfc657e2a", "5fcb6fab3ad6faec", "6c44198c4a475817",
  ].map((h) => BigInt("0x" + h));

  const SHA512_H0 = [
    "6a09e667f3bcc908", "bb67ae8584caa73b", "3c6ef372fe94f82b", "a54ff53a5f1d36f1",
    "510e527fade682d1", "9b05688c2b3e6c1f", "1f83d9abfb41bd6b", "5be0cd19137e2179",
  ].map((h) => BigInt("0x" + h));

  const MASK64 = (1n << 64n) - 1n;
  const rotr = (x, n) => ((x >> n) | (x << (64n - n))) & MASK64;

  /** SHA-512 のダイジェスト（64 バイト）を返す */
  function sha512(bytes) {
    const bitLength = BigInt(bytes.length) * 8n;
    const paddedLength = Math.ceil((bytes.length + 17) / 128) * 128;
    const data = new Uint8Array(paddedLength);
    data.set(bytes);
    data[bytes.length] = 0x80;
    for (let i = 0; i < 16; i++) {
      data[paddedLength - 1 - i] = Number((bitLength >> BigInt(8 * i)) & 0xffn);
    }

    const h = SHA512_H0.slice();
    const w = new Array(80);
    for (let offset = 0; offset < paddedLength; offset += 128) {
      for (let t = 0; t < 16; t++) {
        let v = 0n;
        for (let b = 0; b < 8; b++) v = (v << 8n) | BigInt(data[offset + t * 8 + b]);
        w[t] = v;
      }
      for (let t = 16; t < 80; t++) {
        const s0 = rotr(w[t - 15], 1n) ^ rotr(w[t - 15], 8n) ^ (w[t - 15] >> 7n);
        const s1 = rotr(w[t - 2], 19n) ^ rotr(w[t - 2], 61n) ^ (w[t - 2] >> 6n);
        w[t] = (w[t - 16] + s0 + w[t - 7] + s1) & MASK64;
      }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let t = 0; t < 80; t++) {
        const S1 = rotr(e, 14n) ^ rotr(e, 18n) ^ rotr(e, 41n);
        const ch = (e & f) ^ (~e & MASK64 & g);
        const temp1 = (hh + S1 + ch + SHA512_K[t] + w[t]) & MASK64;
        const S0 = rotr(a, 28n) ^ rotr(a, 34n) ^ rotr(a, 39n);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (S0 + maj) & MASK64;
        hh = g; g = f; f = e;
        e = (d + temp1) & MASK64;
        d = c; c = b; b = a;
        a = (temp1 + temp2) & MASK64;
      }
      h[0] = (h[0] + a) & MASK64; h[1] = (h[1] + b) & MASK64;
      h[2] = (h[2] + c) & MASK64; h[3] = (h[3] + d) & MASK64;
      h[4] = (h[4] + e) & MASK64; h[5] = (h[5] + f) & MASK64;
      h[6] = (h[6] + g) & MASK64; h[7] = (h[7] + hh) & MASK64;
    }

    const out = new Uint8Array(64);
    for (let i = 0; i < 8; i++) {
      for (let b = 0; b < 8; b++) {
        out[i * 8 + b] = Number((h[i] >> BigInt(56 - 8 * b)) & 0xffn);
      }
    }
    return out;
  }

  const toHex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");

  // ---------------------------------------------------------------
  // Python の random（CPython の Mersenne Twister, MT19937）
  // ---------------------------------------------------------------
  const N = 624;
  const M = 397;

  class PythonRandom {
    /** random.seed(text)（version=2、文字列シード）と同じ初期化 */
    constructor(seedText) {
      this.mt = new Uint32Array(N);
      this.index = N;

      const textBytes = utf8(seedText);
      const digest = sha512(textBytes);
      // 「文字列の UTF-8 + その SHA-512」をビッグエンディアンの巨大な整数とみなす
      let bytes = new Uint8Array(textBytes.length + digest.length);
      bytes.set(textBytes);
      bytes.set(digest, textBytes.length);
      const pad = (4 - (bytes.length % 4)) % 4;
      if (pad) {
        const padded = new Uint8Array(bytes.length + pad);
        padded.set(bytes, pad);
        bytes = padded;
      }
      // 下位から 32 ビットずつ区切って init_by_array のキーにする
      const key = [];
      for (let i = bytes.length; i > 0; i -= 4) {
        key.push(((bytes[i - 4] << 24) | (bytes[i - 3] << 16) | (bytes[i - 2] << 8) | bytes[i - 1]) >>> 0);
      }
      while (key.length > 1 && key[key.length - 1] === 0) key.pop();
      if (key.length === 0) key.push(0);

      this.initByArray(key);
    }

    initGenrand(s) {
      const mt = this.mt;
      mt[0] = s >>> 0;
      for (let i = 1; i < N; i++) {
        mt[i] = (Math.imul(1812433253, mt[i - 1] ^ (mt[i - 1] >>> 30)) + i) >>> 0;
      }
      this.index = N;
    }

    initByArray(key) {
      const mt = this.mt;
      this.initGenrand(19650218);
      let i = 1;
      let j = 0;
      for (let k = Math.max(N, key.length); k > 0; k--) {
        mt[i] = ((mt[i] ^ Math.imul(mt[i - 1] ^ (mt[i - 1] >>> 30), 1664525)) + key[j] + j) >>> 0;
        i++; j++;
        if (i >= N) { mt[0] = mt[N - 1]; i = 1; }
        if (j >= key.length) j = 0;
      }
      for (let k = N - 1; k > 0; k--) {
        mt[i] = ((mt[i] ^ Math.imul(mt[i - 1] ^ (mt[i - 1] >>> 30), 1566083941)) - i) >>> 0;
        i++;
        if (i >= N) { mt[0] = mt[N - 1]; i = 1; }
      }
      mt[0] = 0x80000000;
      this.index = N;
    }

    twist() {
      const mt = this.mt;
      for (let k = 0; k < N; k++) {
        const y = (mt[k] & 0x80000000) | (mt[(k + 1) % N] & 0x7fffffff);
        mt[k] = (mt[(k + M) % N] ^ (y >>> 1) ^ ((y & 1) ? 0x9908b0df : 0)) >>> 0;
      }
      this.index = 0;
    }

    /** 32 ビットの乱数（genrand_uint32） */
    nextUint32() {
      if (this.index >= N) this.twist();
      let y = this.mt[this.index++];
      y ^= y >>> 11;
      y ^= (y << 7) & 0x9d2c5680;
      y ^= (y << 15) & 0xefc60000;
      y ^= y >>> 18;
      return y >>> 0;
    }

    /** random.random() */
    random() {
      const a = this.nextUint32() >>> 5;
      const b = this.nextUint32() >>> 6;
      return (a * 67108864 + b) * (1 / 9007199254740992);
    }

    /** random.getrandbits(k)（1〜32） */
    getrandbits(k) {
      return this.nextUint32() >>> (32 - k);
    }

    /** random._randbelow(n) */
    randbelow(n) {
      const k = 32 - Math.clz32(n); // n.bit_length()
      let r = this.getrandbits(k);
      while (r >= n) r = this.getrandbits(k);
      return r;
    }

    /** random.choices(population, k=count) */
    choices(population, count) {
      const n = population.length;
      const result = [];
      for (let i = 0; i < count; i++) result.push(population[Math.floor(this.random() * n)]);
      return result;
    }

    /** random.sample(population, k=count) */
    sample(population, count) {
      const n = population.length;
      if (count < 0 || count > n) throw new RangeError("Sample larger than population or is negative");
      const result = [];
      let setsize = 21;
      if (count > 5) setsize += 4 ** Math.ceil(Math.log(count * 3) / Math.log(4));
      if (n <= setsize) {
        const pool = population.slice();
        for (let i = 0; i < count; i++) {
          const j = this.randbelow(n - i);
          result.push(pool[j]);
          pool[j] = pool[n - i - 1];
        }
      } else {
        const selected = new Set();
        for (let i = 0; i < count; i++) {
          let j = this.randbelow(n);
          while (selected.has(j)) j = this.randbelow(n);
          selected.add(j);
          result.push(population[j]);
        }
      }
      return result;
    }

    /** random.shuffle(list) */
    shuffle(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = this.randbelow(i + 1);
        [list[i], list[j]] = [list[j], list[i]];
      }
    }
  }

  // ---------------------------------------------------------------
  // パスワード生成（3wordPasGen.py の generate_password と同じ）
  // ---------------------------------------------------------------
  const BASE_CHARS = Array.from("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789")
    .filter((c) => !"l1O0".includes(c));
  const SYMBOL_CHARS = Array.from("!#@$%&*()=+?/");

  function generatePassword(keywords, useSymbols = true, length = 12) {
    const combined = keywords.join("");                 // キーワードを区切りなしで結合
    const hashDigest = toHex(sha512(utf8(combined)));   // SHA-512 の16進文字列
    const rng = new PythonRandom(hashDigest);           // 同じキーワードで同じパスワードになる

    if (useSymbols) {
      if (length < 2) throw new RangeError("Password length must be at least 2 to include symbols.");
      const selectedSymbols = rng.sample(SYMBOL_CHARS, 2);
      const remainingChars = rng.choices(BASE_CHARS, length - 2);
      const passwordList = selectedSymbols.concat(remainingChars);
      rng.shuffle(passwordList);
      return passwordList.join("");
    }
    return rng.choices(BASE_CHARS, length).join("");
  }

  // ---------------------------------------------------------------
  // 入力の前処理（Python の .strip() と zenkaku_to_hankaku）
  // ---------------------------------------------------------------
  // Python の str.isspace() が真になる文字
  const PY_WHITESPACE = new Set([
    0x09, 0x0a, 0x0b, 0x0c, 0x0d, 0x1c, 0x1d, 0x1e, 0x1f, 0x20, 0x85, 0xa0,
    0x1680, 0x2000, 0x2001, 0x2002, 0x2003, 0x2004, 0x2005, 0x2006, 0x2007,
    0x2008, 0x2009, 0x200a, 0x2028, 0x2029, 0x202f, 0x205f, 0x3000,
  ]);

  function normalizeKeyword(text) {
    const chars = Array.from(text); // コードポイント単位
    let start = 0;
    let end = chars.length;
    while (start < end && PY_WHITESPACE.has(chars[start].codePointAt(0))) start++;
    while (end > start && PY_WHITESPACE.has(chars[end - 1].codePointAt(0))) end--;
    return chars.slice(start, end).join("").normalize("NFKC");
  }

  // ---------------------------------------------------------------
  // Python 版との互換性チェック（Python 版で実際に生成した値）
  // ---------------------------------------------------------------
  const COMPATIBILITY_VECTORS = [
    [["apple", "banana", "cherry"], "jWeK2)zEFJ!c", "FWcjEFK2eJzo"],
    [["", "", ""], "KBVh)FwY#AMQ", "HAMKQFYwhBVw"],
    [["パスワード", "東京", "🍎"], "y$7+GpMDGC3E", "L7G3CyEpMGDD"],
    [["Hello World", "123", "!?"], "y&iviqNkNa=Q", "tiyiNQqkNvaz"],
    [["ａｐｐｌｅ", "  banana ", "ｶﾀｶﾅ"], "#2YdXixNR?iP", "QYi2RidXPNxJ"],
  ];

  function passesCompatibilityCheck() {
    try {
      return COMPATIBILITY_VECTORS.every(([input, symbols, noSymbols]) => {
        const keywords = input.map(normalizeKeyword);
        return generatePassword(keywords, true) === symbols
          && generatePassword(keywords, false) === noSymbols;
      });
    } catch (e) {
      return false;
    }
  }

  return { generatePassword, normalizeKeyword, passesCompatibilityCheck, sha512, toHex, utf8 };
})();

// -----------------------------------------------------------------
// 画面の処理
// -----------------------------------------------------------------
if (typeof document !== "undefined") {
  const $ = (id) => document.getElementById(id);
  const inputs = [$("kw1"), $("kw2"), $("kw3")];
  const passwords = { pw_symbols: "", pw_nosymbols: "" };

  const setStatus = (text) => { $("status").textContent = text; };

  // 生成ボタン処理
  function generatePasswords() {
    const keywords = inputs.map((input) => ThreeWordPasGen.normalizeKeyword(input.value));
    passwords.pw_symbols = ThreeWordPasGen.generatePassword(keywords, true);
    passwords.pw_nosymbols = ThreeWordPasGen.generatePassword(keywords, false);
    $("pw_symbols").textContent = passwords.pw_symbols;
    $("pw_nosymbols").textContent = passwords.pw_nosymbols;
    setStatus("");
  }

  // クリップボードへコピー（使えない環境では従来の方法で）
  async function writeClipboard(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (e) { /* 下の方法を試す */ }
    const area = document.createElement("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.top = "-1000px";
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(area);
    return ok;
  }

  // コピー処理（共通）
  async function copyPassword(labelId, button) {
    const pw = passwords[labelId];
    if (!pw) {
      setStatus("先に生成してください");
      return;
    }
    const ok = await writeClipboard(pw);
    setStatus(ok ? `${button.textContent} をコピーしました` : "コピーできませんでした");
  }

  // リセット処理
  function resetFields() {
    inputs.forEach((input) => { input.value = ""; });
    passwords.pw_symbols = "";
    passwords.pw_nosymbols = "";
    $("pw_symbols").textContent = "";
    $("pw_nosymbols").textContent = "";
    setStatus("リセットしました");
  }

  $("generate").addEventListener("click", generatePasswords);
  $("reset").addEventListener("click", resetFields);
  $("copy_symbols").addEventListener("click", (e) => copyPassword("pw_symbols", e.currentTarget));
  $("copy_nosymbols").addEventListener("click", (e) => copyPassword("pw_nosymbols", e.currentTarget));

  // Enter キーで次の入力欄へ、最後の欄なら生成
  inputs.forEach((input, i) => {
    input.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" || e.isComposing) return;
      e.preventDefault();
      if (i < inputs.length - 1) inputs[i + 1].focus();
      else { input.blur(); generatePasswords(); }
    });
  });

  // 起動時に Python 版と同じ結果になるか確認
  if (!ThreeWordPasGen.passesCompatibilityCheck()) {
    $("warning").hidden = false;
    $("generate").disabled = true;
  }

  // オフラインで使えるように、ページを端末に保存する（https で開いたときのみ）
  if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => { /* 保存できなくても通常どおり使える */ });
  }
}
</script>
</body>
</html>
